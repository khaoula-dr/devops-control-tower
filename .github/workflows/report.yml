name: Generate PDF Report

on:
  schedule:
    - cron: '0 22 * * *'  # Chaque soir à 22h
  workflow_dispatch:        # Ou manuellement

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install requests fpdf2

      - name: Generate PDF Report
        run: python generate-report.py

      - name: Upload PDF as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: rapport-performance
          path: rapport-*.pdf
          retention-days: 30
