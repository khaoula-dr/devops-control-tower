name: CI Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Helm Lint - Vote
        run: helm lint helm/vote

      - name: Helm Lint - Result
        run: helm lint helm/result

      - name: Helm Lint - Worker
        run: helm lint helm/worker

      - name: Helm Lint - Redis
        run: helm lint helm/redis

      - name: Helm Lint - Postgres
        run: helm lint helm/postgres

  build-push:
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Vote
        uses: docker/build-push-action@v5
        with:
          context: ./voting-app/vote
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/vote:latest

      - name: Build and Push Result
        uses: docker/build-push-action@v5
        with:
          context: ./voting-app/result
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/result:latest

      - name: Build and Push Worker
        uses: docker/build-push-action@v5
        with:
          context: ./voting-app/worker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/worker:latest
