apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voting-ingress
  namespace: voting
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: ""
spec:
  rules:
    - host: vote.devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vote-vote
                port:
                  number: 80
    - host: result.devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result-result
                port:
                  number: 80
