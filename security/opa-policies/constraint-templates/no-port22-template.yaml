apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8snoporttwentytwo
spec:
  crd:
    spec:
      names:
        kind: K8sNoPort22
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8snoporttwentytwo

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          port := container.ports[_]
          port.containerPort == 22
          msg := sprintf("Container '%v' exposes port 22 (SSH) — this is not allowed", [container.name])
        }