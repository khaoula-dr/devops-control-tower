replicaCount: 2

image:
  repository: dockersamples/examplevotingapp_result
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  nodePort: 31001

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

hpa:
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
